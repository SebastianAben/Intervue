name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intervue
          POSTGRES_USER: intervue
          POSTGRES_PASSWORD: intervue
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U intervue -d intervue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://intervue:intervue@localhost:5433/intervue
      JWT_SECRET: ci-only-secret
      GEMINI_API_KEY: ci-only-placeholder
      GEMINI_MODEL: gemini-3-flash-preview
      CORS_ORIGIN: http://localhost:3000
      NONVERBAL_INFERENCE_URL: http://127.0.0.1:8765/predict
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @intervue/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @intervue/api test

      - name: Build
        run: pnpm build

      - name: Validate home-server compose
        run: docker compose --env-file deploy/home-server/.env.server.example -p intervue-dev -f deploy/home-server/docker-compose.server.yml config
